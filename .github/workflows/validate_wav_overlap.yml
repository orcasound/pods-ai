---
name: Validate WAV sample overlap

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate_wav_overlap:
    permissions:
      actions: write  # for fkirc/skip-duplicate-actions to skip or stop workflow runs
      contents: read  # for actions/checkout to fetch code
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            *.archive.ubuntu.com:80
            security.ubuntu.com:443
            *.microsoft.com:443
            api.github.com:443
            dl.google.com:443
            esm.ubuntu.com:443
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443

      - id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578  # v5.3.2
        with:
          cancel_others: 'false'
          paths: '["requirements.txt", "output/csv/training_3s_samples.csv", "output/csv/testing_60s_samples.csv", "src/download_wavs.py", ".github/workflows/validate_wav_overlap.yml"]'

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        if: steps.skip_check.outputs.should_skip != 'true'

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        if: steps.skip_check.outputs.should_skip != 'true'
        with:
          python-version: '3.14'

      - name: Install Python dependencies
        if: steps.skip_check.outputs.should_skip != 'true'
        run: pip install -r requirements.txt

      - name: Validate CSV overlap rules
        if: steps.skip_check.outputs.should_skip != 'true'
        run: python src/download_wavs.py --validate-only
