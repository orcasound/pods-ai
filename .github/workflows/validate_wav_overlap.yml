---
name: Validate WAV sample overlap

on:
  pull_request:
    paths:
      - output/csv/training_3s_samples.csv
      - output/csv/testing_60s_samples.csv
      - src/download_wavs.py
      - .github/workflows/validate_wav_overlap.yml

permissions:
  contents: read

jobs:
  validate_wav_overlap:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.archive.ubuntu.com:80
            *.microsoft.com:443
            api.github.com:443
            dl.google.com:443
            esm.ubuntu.com:443
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Validate CSV overlap rules
        run: python src/download_wavs.py --validate-only
